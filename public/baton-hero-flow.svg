<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" fill="none" role="img" aria-label="흩어진 업무 자료를 AI가 정리해 인수인계서로 만들어 다음 담당자에게 전달하는 모습">
  <defs>
    <linearGradient id="f-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="f-sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E3A8A" flood-opacity="0.10"/>
    </filter>
    <filter id="f-sh2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.08"/>
    </filter>
    <marker id="f-ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#93C5FD"/>
    </marker>
  </defs>

  <!-- 배경 장식 -->
  <circle cx="96" cy="104" r="74" fill="#DBEAFE" opacity=".5"/>
  <circle cx="570" cy="452" r="88" fill="#DBEAFE" opacity=".42"/>
  <circle cx="600" cy="98" r="9" fill="#93C5FD" opacity=".7"/>
  <circle cx="46" cy="404" r="7" fill="#93C5FD" opacity=".55"/>
  <circle cx="300" cy="66" r="6" fill="#BFDBFE"/>
  <circle cx="392" cy="470" r="8" fill="#BFDBFE"/>

  <!-- 흩어진 업무 자료 -->
  <g filter="url(#f-sh2)">
