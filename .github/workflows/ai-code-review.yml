name: AI Code Review

on:
  pull_request_target:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # PR 이벤트와 댓글 이벤트가 같은 그룹으로 묶인다.
  # 취소를 켜면 Vercel 봇 배포 댓글이 만든 실행이 진행 중인 리뷰를 죽인다.
  # (job의 if로 봇을 걸러도 동시성 취소가 먼저 일어난다.)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: PR-Agent Review
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/review') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check manual review target branch
        id: target-branch
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"

          if [[ "$base_ref" == "develop" || "$base_ref" == "main" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping review for unsupported target branch: $base_ref"
          fi

      - name: Capture existing review state
        id: review_context
        if: >-
          github.event_name == 'pull_request_target' ||
          steps.target-branch.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          previous_review="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("PR Reviewer Guide")))] | sort_by(.updated_at) | last // {id: "", updated_at: ""} | [.id, .updated_at] | @tsv'
          )"

          IFS=$'\t' read -r previous_comment_id previous_updated_at <<< "$previous_review"
          echo "previous_comment_id=$previous_comment_id" >> "$GITHUB_OUTPUT"
          echo "previous_updated_at=$previous_updated_at" >> "$GITHUB_OUTPUT"

      - name: Review pull request
        if: >-
          github.event_name == 'pull_request_target' ||
          steps.target-branch.outputs.allowed == 'true'
        uses: docker://pragent/pr-agent@sha256:b253845caa8c7ff5ce8be78f32996647982bdd4890826a962b78eff2e385a825
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: gemini/gemini-3.1-flash-lite
          config.fallback_models: '[]'
          config.custom_model_max_tokens: '1048576'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'false'
          github_action_config.auto_improve: 'false'
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

      - name: Verify review was published
        if: >-
          github.event_name == 'pull_request_target' ||
          steps.target-branch.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PREVIOUS_COMMENT_ID: ${{ steps.review_context.outputs.previous_comment_id }}
          PREVIOUS_UPDATED_AT: ${{ steps.review_context.outputs.previous_updated_at }}
        run: |
          latest_review="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("PR Reviewer Guide")))] | sort_by(.updated_at) | last // {id: "", updated_at: ""} | [.id, .updated_at] | @tsv'
          )"

          IFS=$'\t' read -r latest_comment_id latest_updated_at <<< "$latest_review"

          if [[ -z "$latest_comment_id" ]]; then
            echo "PR-Agent did not publish a review during this run."
            exit 1
          fi

          if [[ "$latest_comment_id" == "$PREVIOUS_COMMENT_ID" && "$latest_updated_at" == "$PREVIOUS_UPDATED_AT" ]]; then
            echo "PR-Agent did not create or update its review during this run."
            exit 1
          fi

          echo "PR-Agent review comment $latest_comment_id was published or updated."
